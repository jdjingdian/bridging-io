<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BridgingIO Setup</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f8fc;
      --panel: #ffffff;
      --ink: #12314f;
      --muted: #4f6783;
      --primary: #0d74d4;
      --ok: #0b8f4d;
      --warn: #ad5b14;
      --border: #d3e1ef;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans", sans-serif;
      background: radial-gradient(circle at 20% 10%, #ebf5ff, var(--bg) 60%);
      color: var(--ink);
    }

    main {
      max-width: 760px;
      margin: 56px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 16px 44px rgba(12, 56, 94, 0.12);
      padding: 32px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      line-height: 1.6;
      color: var(--muted);
      margin: 16px 0;
    }

    .helper {
      margin-top: 8px;
      border-left: 3px solid var(--primary);
      padding-left: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    input {
      flex: 1 1 280px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: var(--ink);
      background: #f8fbff;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
    }

    button.secondary {
      background: #2c5f93;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--warn);
    }

    .status.ok {
      color: var(--ok);
    }
  </style>
</head>
<body data-screen="onboarding">
  <main>
    <h1>Choose Runtime Root</h1>
    <p>
      BridgingIO will store managed core config, logs, state, and artifacts in this directory.
      Keep this directory writable and stable to allow restart recovery.
    </p>
    <p class="helper" id="recovery-path-note">
      If your saved runtime root is missing or permission is revoked, return here and choose a new writable directory.
    </p>

    <label for="runtime-root-path">Runtime root directory</label>
    <div class="row">
      <input id="runtime-root-path" type="text" readonly placeholder="No directory selected" />
      <button id="pick-runtime-root" type="button">Choose Directory</button>
    </div>

    <div class="row">
      <button id="validate-runtime-root" class="secondary" type="button">Validate Writable Access</button>
      <button id="continue-workspace" type="button" disabled>Continue To Workspace</button>
    </div>

    <div id="onboarding-status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.invoke;
    const pathField = document.getElementById("runtime-root-path");
    const status = document.getElementById("onboarding-status");
    const continueButton = document.getElementById("continue-workspace");

    function setStatus(text, ok) {
      status.textContent = text;
      status.className = ok ? "status ok" : "status";
    }

    function selectedPath() {
      return pathField.value.trim();
    }

    async function chooseDirectory() {
      if (!invoke) {
        setStatus("Trusted host bridge is unavailable.", false);
        return;
      }
      const path = await invoke("pick_runtime_root_dir");
      if (path && path.trim().length > 0) {
        pathField.value = path;
        continueButton.disabled = true;
        setStatus("Directory selected. Validate writable access before continuing.", false);
      }
    }

    async function validateDirectory() {
      if (!invoke) {
        setStatus("Trusted host bridge is unavailable.", false);
        return;
      }
      const path = selectedPath();
      if (!path) {
        setStatus("Select a runtime root first.", false);
        return;
      }
      const result = await invoke("validate_runtime_root", { path });
      if (result?.ok) {
        continueButton.disabled = false;
        setStatus("Runtime root is writable. You can continue.", true);
      } else {
        continueButton.disabled = true;
        setStatus(result?.message || "Runtime root is not writable.", false);
      }
    }

    async function completeOnboarding() {
      if (!invoke) {
        setStatus("Trusted host bridge is unavailable.", false);
        return;
      }
      const path = selectedPath();
      if (!path) {
        setStatus("Select and validate a runtime root first.", false);
        return;
      }
      const result = await invoke("complete_onboarding_runtime_root", { path });
      if (result?.ok) {
        setStatus("Runtime root saved. Opening workspace...", true);
      } else {
        continueButton.disabled = true;
        setStatus(result?.message || "Could not save runtime root.", false);
      }
    }

    document.getElementById("pick-runtime-root").addEventListener("click", chooseDirectory);
    document.getElementById("validate-runtime-root").addEventListener("click", validateDirectory);
    document.getElementById("continue-workspace").addEventListener("click", completeOnboarding);
  </script>
</body>
</html>
