schema_version = 1

[core]
instance_name = "bridgingio-local"
data_dir = "auto"
log_level = "info"
operator_locale = "en-US"

[storage]
metadata_backend = "sqlite"
metadata_path = "auto"

[storage.artifacts]
backend = "filesystem"
root = "auto"
max_bytes = 1073741824
eviction_policy = "lru"

[vault]
backend = "builtin-encrypted"
namespace = "io.bridgingio"

[vault.unlock]
trigger_policy = "on-first-secret-access"
allowed_methods = ["os-native", "passphrase"]
preferred_method = "os-native"
cache_ttl_sec = 600
require_fresh_user_verification = true

[vault.protectors.primary]
kind = "os-native"

[[vault.protectors.recovery]]
kind = "passphrase"
kdf = "argon2id"
profile = "interactive-default"

[vault.ssh]
delivery_mode = "ssh-agent-broker"
fallback_delivery_mode = "ephemeral-identity-file"

[control_plane]
enabled = true
transport = "platform-ipc"
endpoint = "auto"

[model_plane.http]
enabled = true
host = "127.0.0.1"
port = 19718
allow_non_loopback = false

[model_plane.http.auth]
mode = "none"
required_when_non_loopback = true
allow_loopback_anonymous_compat = true

[toolchains.ssh]
path_override = ""
prefer_builtin_fallback = false

[toolchains.adb]
path_override = "__GLOBAL_ADB_OVERRIDE__"
prefer_builtin_fallback = true

[policies.defaults]
reuse_policy = "resume_or_create"
approval_mode = "on-risk"
capture_env_fingerprint = true
mcp_target_resolution_policy = "confirm_if_family"

[[targets]]
id = "lab-ssh-01"
display_name = "Lab Ubuntu"
kind = "ssh"
enabled = true
aliases = ["lab", "ubuntu-main"]
credential_ref = "vault://bridgingio/ssh-private-key/lab"
notes = "Primary lab server"

[targets.connection]
host = "10.0.0.18"
port = 22
username = "debug"
known_hosts_policy = "system-default"

[targets.providers.terminal]
enabled = true

[[targets.providers.git.repositories]]
id = "bridgingio"
path = "/srv/repos/bridgingio"
remote_name = "origin"
web_url = "https://gerrit.example.com/plugins/gitiles/bridgingio"

[targets.providers.git.repositories.review]
kind = "gerrit"
base_url = "https://gerrit.example.com"
project = "bridgingio"

[[targets]]
id = "android-emulator"
display_name = "Android Emulator"
kind = "adb"
enabled = true
aliases = ["emu", "pixel-test"]
credential_ref = "vault://bridgingio/adb/default"

[targets.connection]
selector_kind = "serial"
selector_value = "emulator-5554"

[targets.toolchains.adb]
path_override = "__TARGET_ADB_OVERRIDE__"
prefer_builtin_fallback = false

[targets.providers.terminal]
enabled = true
shell = "/system/bin/sh"
